name: android

# Builds the MAUI Android app and runs the full test suite on every push
# and PR. Version tags (v1.0, v1.1, ...) additionally produce a release
# AAB artifact, signed when the keystore secrets are present.
#
# Required secrets for a signed release AAB (repo Settings > Secrets and
# variables > Actions); see docs/release-checklist.md A1:
#   ANDROID_KEYSTORE_BASE64 : base64 of the release keystore file
#                             (base64 -w0 ocw-offline-release.keystore)
#   ANDROID_KEY_ALIAS       : key alias inside the keystore
#   ANDROID_STORE_PASS      : keystore password
#   ANDROID_KEY_PASS        : key password
# Without them the AAB still builds (unsigned): fine for smoke testing,
# not for Play upload.

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install maui-android workload
        run: sudo dotnet workload install maui-android

      - name: Build app (Android Debug)
        run: dotnet build work/OcwOffline/OcwOffline.csproj -p:TargetFrameworks=net10.0-android -c Debug

      - name: Build tests
        run: dotnet build work/OcwOffline.Tests/OcwOffline.Tests.csproj -c Debug

      # The xUnit console runner (not dotnet test) matches the documented
      # local path in notes/env-setup.md: vstest's testhost channel is
      # corrupted in the maintainer's sandbox. On a healthy runner
      # dotnet test would work; keep the console runner for parity.
      - name: Install xUnit console runner
        run: |
          mkdir -p "$RUNNER_TEMP/xunit-console"
          cd "$RUNNER_TEMP/xunit-console"
          dotnet new console -n runner > /dev/null
          dotnet add runner package xunit.runner.console --version 2.9.2
          echo "XUNIT_CONSOLE=$HOME/.nuget/packages/xunit.runner.console/2.9.2/tools/net6.0/xunit.console.dll" >> "$GITHUB_ENV"

      - name: Run tests (xUnit console runner)
        env:
          DOTNET_ROLL_FORWARD: LatestMajor
        run: dotnet exec "$XUNIT_CONSOLE" work/OcwOffline.Tests/bin/Debug/net10.0/OcwOffline.Tests.dll

  release-aab:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install maui-android workload
        run: sudo dotnet workload install maui-android

      - name: Publish release AAB
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASS: ${{ secrets.ANDROID_STORE_PASS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          sign_args=""
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            sign_args="/p:AndroidKeyStore=true /p:AndroidSigningKeyStore=$RUNNER_TEMP/release.keystore /p:AndroidSigningKeyAlias=$ANDROID_KEY_ALIAS /p:AndroidSigningStorePass=$ANDROID_STORE_PASS /p:AndroidSigningKeyPass=$ANDROID_KEY_PASS"
          fi
          # shellcheck disable=SC2086
          dotnet publish work/OcwOffline/OcwOffline.csproj -p:TargetFrameworks=net10.0-android -c Release /p:AndroidPackageFormat=aab $sign_args

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: ocw-offline-aab
          path: work/OcwOffline/bin/Release/net10.0-android/*.aab
