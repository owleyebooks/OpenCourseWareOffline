name: prose-lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run prose lint (em-dash, dodge, diary)
        run: python3 tools/lint/prose_lint.py .
