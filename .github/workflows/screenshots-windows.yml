name: screenshots-windows

# Manual-only: builds the WinUI target on a Windows runner, launches the
# unpackaged exe, captures the main window with PrintWindow, and uploads
# the PNGs as an artifact. This is the visual check for "what does the app
# look like" now that the Android emulator path proved untrustworthy
# (startup-race measure corruption, screenshot-run iteration 19).
# This never runs on push.

on:
  workflow_dispatch:

jobs:
  capture:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Build WinUI exe
        run: dotnet build work/OcwOffline/OcwOffline.csproj -f net10.0-windows10.0.19041.0 -c Release --nologo -v q

      - name: Launch app and capture screenshots
        shell: powershell
        run: |
          $exe = Get-ChildItem -Path "work/OcwOffline/bin/Release/net10.0-windows10.0.19041.0" -Filter "OcwOffline.exe" -Recurse | Select-Object -First 1
          if (-not $exe) { throw "OcwOffline.exe not found under bin/Release/net10.0-windows10.0.19041.0" }
          Write-Host "Launching $($exe.FullName)"
          $proc = Start-Process -FilePath $exe.FullName -PassThru

          $captureCode = @'
          using System;
          using System.Collections.Generic;
          using System.Drawing;
          using System.Drawing.Imaging;
          using System.Runtime.InteropServices;
          using System.Text;
          public class WinCap {
              public delegate bool EnumWindowsProc(IntPtr hWnd, IntPtr lParam);
              [DllImport("user32.dll")] public static extern bool EnumWindows(EnumWindowsProc lpEnumFunc, IntPtr lParam);
              [DllImport("user32.dll")] public static extern int GetWindowText(IntPtr hWnd, StringBuilder lpString, int nMaxCount);
              [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr hWnd);
              [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr hwnd, out RECT rect);
              [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr hwnd);
              [StructLayout(LayoutKind.Sequential)] public struct RECT { public int Left; public int Top; public int Right; public int Bottom; }
              // Returns lines "handle|title|w|h|x|y" for every visible top-level window.
              public static string[] ListWindows() {
                  var list = new List<string>();
                  EnumWindows((hWnd, lParam) => {
                      if (IsWindowVisible(hWnd)) {
                          var sb = new StringBuilder(256);
                          GetWindowText(hWnd, sb, 256);
                          RECT r; GetWindowRect(hWnd, out r);
                          int w = r.Right - r.Left; int h = r.Bottom - r.Top;
                          if (w > 0 && h > 0) list.Add(hWnd.ToString("X") + "|" + sb.ToString() + "|" + w + "|" + h + "|" + r.Left + "|" + r.Top);
                      }
                      return true;
                  }, IntPtr.Zero);
                  return list.ToArray();
              }
              public static void Foreground(long handle) { SetForegroundWindow(new IntPtr(handle)); }
              public static int[] WindowRect(long handle) {
                  RECT r; GetWindowRect(new IntPtr(handle), out r);
                  return new int[] { r.Left, r.Top, r.Right - r.Left, r.Bottom - r.Top };
              }
              // BitBlt of the composited screen over the given region. Unlike
              // PrintWindow, this sees DirectComposition (WinUI 3) content.
              public static void CaptureRegion(int x, int y, int w, int h, string path) {
                  using (Bitmap bmp = new Bitmap(w, h)) {
                      using (Graphics g = Graphics.FromImage(bmp)) {
                          g.CopyFromScreen(x, y, 0, 0, new Size(w, h));
                      }
                      bmp.Save(path, ImageFormat.Png);
                  }
              }
              public static void CaptureFullScreen(string path) {
                  int w = System.Windows.Forms.Screen.PrimaryScreen.Bounds.Width;
                  int h = System.Windows.Forms.Screen.PrimaryScreen.Bounds.Height;
                  CaptureRegion(0, 0, w, h, path);
              }
              // Fraction of sampled pixels that are near-white, 0..1.
              public static double WhiteFraction(string path) {
                  using (Bitmap bmp = new Bitmap(path)) {
                      int white = 0, total = 0;
                      for (int y = 0; y < bmp.Height; y += 4) {
                          for (int x = 0; x < bmp.Width; x += 4) {
                              Color c = bmp.GetPixel(x, y);
                              total++;
                              if (c.R > 240 && c.G > 240 && c.B > 240) white++;
                          }
                      }
                      return total == 0 ? 1.0 : (double)white / total;
                  }
              }
          }
          '@
          Add-Type -TypeDefinition $captureCode -ReferencedAssemblies System.Drawing, System.Windows.Forms

          New-Item -ItemType Directory -Force -Path screenshots | Out-Null
          $captured = 0
          for ($i = 0; $i -lt 30 -and $captured -lt 3; $i++) {
            Start-Sleep -Seconds 5
            $wins = [WinCap]::ListWindows()
            Write-Host "Attempt $i visible windows:"
            $best = $null; $bestArea = 0; $titleHit = $null
            foreach ($w in $wins) {
              Write-Host "  $w"
              $parts = $w -split '\|', 6
              $area = [int]$parts[2] * [int]$parts[3]
              if ($parts[1] -eq "OCW Offline") { $titleHit = $parts[0] }
              elseif ($area -gt $bestArea) { $bestArea = $area; $best = $parts[0] }
            }
            $pick = if ($titleHit) { $titleHit } else { $best }
            if ($pick) {
              $h = [Convert]::ToInt64($pick, 16)
              [WinCap]::Foreground($h)
              Start-Sleep -Seconds 1
              $r = [WinCap]::WindowRect($h)
              $tmp = "screenshots/tmp-$i.png"
              [WinCap]::CaptureRegion($r[0], $r[1], $r[2], $r[3], $tmp)
              $wf = [WinCap]::WhiteFraction($tmp)
              Write-Host "Attempt ${i}: captured region $($r[2])x$($r[3]) white fraction $wf"
              if ($wf -lt 0.99) {
                Move-Item $tmp "screenshots/main-$captured.png" -Force
                Write-Host "Kept screenshots/main-$captured.png"
                $captured++
              } else {
                Write-Host "Attempt ${i}: frame blank, waiting for render"
                Remove-Item $tmp -ErrorAction SilentlyContinue
              }
            } else {
              Write-Host "Attempt ${i}: no visible windows yet"
            }
            if ($proc.HasExited) { throw "App exited early with code $($proc.ExitCode)" }
          }
          if ($captured -eq 0) {
            [WinCap]::CaptureFullScreen("screenshots/debug-fullscreen.png")
            throw "Never captured a non-blank screenshot"
          }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: ocw-windows-screenshots
          path: screenshots/*.png
