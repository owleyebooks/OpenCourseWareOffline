name: screenshots

# Manual-only: boots an Android emulator on a Linux runner, installs the
# debug APK, captures screenshots, and uploads them as an artifact.
# Stays on ubuntu-latest (1x billing) to keep org minutes cheap; this
# never runs on push.

on:
  workflow_dispatch:
  push:
    branches: [screenshot-run]

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Build debug APK
        # EmbedAssembliesIntoApk: a plain Debug build produces a Fast Deployment
        # APK whose assemblies live outside the APK (pushed by the IDE/CLI
        # deploy pipeline). adb install alone never pushes them, so the app
        # aborts on launch. Embedding makes the APK self-contained.
        run: dotnet build work/OcwOffline/OcwOffline.csproj -p:TargetFrameworks=net10.0-android -p:EmbedAssembliesIntoApk=true -c Debug --nologo -v q

      - name: Capture screenshots on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          # NOTE: this action runs each script line in its own shell, so no
          # variable may span lines. Keep every step self-contained on one line.
          # Breadcrumb file: each line appends its stage on success, so a
          # failed run still shows exactly how far the script got.
          script: |
            mkdir -p diag; echo "stage: start" > diag/progress.txt; ls work/OcwOffline/bin/Debug/net10.0-android/ && echo "stage: listed" >> diag/progress.txt
            APK=$(find work/OcwOffline/bin/Debug/net10.0-android -maxdepth 1 -name "*-Signed.apk" | head -1); if [ -z "$APK" ]; then APK=$(find work/OcwOffline/bin/Debug/net10.0-android -maxdepth 1 -name "*.apk" | head -1); fi; echo "Installing [$APK]"; adb install "$APK" && echo "stage: installed" >> diag/progress.txt
            adb logcat -c; adb shell monkey -p com.owleyebooks.ocwoffline -c android.intent.category.LAUNCHER 1 && echo "stage: monkey" >> diag/progress.txt
            for i in $(seq 1 6); do FOCUS=$(adb shell dumpsys window windows | grep mCurrentFocus | head -1); echo "focus: $FOCUS"; echo "$FOCUS" | grep -q com.owleyebooks.ocwoffline && break; sleep 5; done; echo "$FOCUS" > diag/focus.txt; echo "stage: focus-poll" >> diag/progress.txt
            adb shell uiautomator dump /sdcard/anr.xml >/dev/null 2>&1; adb pull /sdcard/anr.xml diag/anr.xml >/dev/null 2>&1 || true
            TAP=$(python3 -c "import xml.etree.ElementTree as ET; t=ET.parse('diag/anr.xml'); n=next((x for x in t.iter('node') if x.get('text')=='Wait'), None); b=[int(v) for v in n.get('bounds').replace('[','').replace(']',',').strip(',').split(',')] if n is not None else None; print(str((b[0]+b[2])//2)+' '+str((b[1]+b[3])//2) if b else '')" 2>/dev/null || true); if [ -n "$TAP" ]; then adb shell input tap $TAP; echo "stage: anr-dismissed" >> diag/progress.txt; sleep 5; fi
            PID=$(adb shell pidof -s com.owleyebooks.ocwoffline | tr -d '\r'); echo "pid=$PID" | tee diag/pid.txt; echo "stage: pid" >> diag/progress.txt
            sleep 45; PID=$(adb shell pidof -s com.owleyebooks.ocwoffline | tr -d '\r'); echo "$(date -u +%T) pid=$PID ticks=$(adb shell cat /proc/$PID/stat 2>/dev/null | tr -d '\r' | awk '{print $14+$15}')" | tee -a diag/cpu.txt; adb shell screencap -p /sdcard/shot1.png && adb pull /sdcard/shot1.png screenshot-1-t1.png || adb exec-out screencap -p > screenshot-1-t1.png; echo "stage: shot1" >> diag/progress.txt
            sleep 60; PID=$(adb shell pidof -s com.owleyebooks.ocwoffline | tr -d '\r'); echo "$(date -u +%T) pid=$PID ticks=$(adb shell cat /proc/$PID/stat 2>/dev/null | tr -d '\r' | awk '{print $14+$15}')" | tee -a diag/cpu.txt; echo "stage: cpu2" >> diag/progress.txt
            PID=$(adb shell pidof -s com.owleyebooks.ocwoffline | tr -d '\r'); adb shell kill -3 $PID; echo "SIGQUIT sent to pid $PID at $(date -u +%T)" | tee diag/sigquit.txt; sleep 8; adb shell screencap -p /sdcard/shot2.png && adb pull /sdcard/shot2.png screenshot-2-t2.png || adb exec-out screencap -p > screenshot-2-t2.png; echo "stage: threads+shot2" >> diag/progress.txt
            sleep 60; PID=$(adb shell pidof -s com.owleyebooks.ocwoffline | tr -d '\r'); echo "$(date -u +%T) pid=$PID ticks=$(adb shell cat /proc/$PID/stat 2>/dev/null | tr -d '\r' | awk '{print $14+$15}')" | tee -a diag/cpu.txt; timeout 60 adb shell uiautomator dump /sdcard/ui.xml && adb pull /sdcard/ui.xml ui.xml || echo "uiautomator failed"; echo "stage: cpu3+dump" >> diag/progress.txt
            sleep 60; PID=$(adb shell pidof -s com.owleyebooks.ocwoffline | tr -d '\r'); echo "$(date -u +%T) pid=$PID ticks=$(adb shell cat /proc/$PID/stat 2>/dev/null | tr -d '\r' | awk '{print $14+$15}')" | tee -a diag/cpu.txt; adb shell screencap -p /sdcard/shot3.png && adb pull /sdcard/shot3.png screenshot-3-t3.png || adb exec-out screencap -p > screenshot-3-t3.png; echo "stage: cpu4+shot3" >> diag/progress.txt
            adb shell dumpsys activity activities | grep -iB2 -A2 ocwoffline > diag/tasks.txt || true; adb logcat -d | grep -iE "ocwoffline|AndroidRuntime|FATAL|mono-stdout" | tail -80 > diag/logcat.txt || true; adb logcat -d | grep "ocwoffline" > diag/startup.txt || true; adb logcat -d -v threadtime > diag/logcat-full.txt; echo "stage: logs" >> diag/progress.txt
            ls -la screenshot-*.png ui.xml diag/ || true; echo "stage: done" >> diag/progress.txt

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-screenshots
          path: |
            screenshot-*.png
            ui.xml
            diag/
