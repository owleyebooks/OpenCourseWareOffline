name: screenshots

# Manual-only: boots an Android emulator on a Linux runner, installs the
# debug APK, captures screenshots, and uploads them as an artifact.
# Stays on ubuntu-latest (1x billing) to keep org minutes cheap; this
# never runs on push.

on:
  workflow_dispatch:
  push:
    branches: [screenshot-run]

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Build debug APK
        run: dotnet build work/HelloWorld/HelloWorld.csproj -p:TargetFrameworks=net10.0-android -p:EmbedAssembliesIntoApk=true -c Debug --nologo -v q

      - name: Reset adb server before emulator boot
        # TEMP diagnostic hardening (screenshot-run only): two consecutive
        # runs failed with "Unable to connect to adb daemon on port: 5037"
        # from the emulator at boot, then every adb command failed. A stale
        # or half-started adb server on the runner is the usual cause, so
        # restart it and prove it is listening before the emulator starts.
        run: adb kill-server || true; adb start-server; adb devices

      - name: Capture screenshots on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: |
            # TEMP time-series diagnostic (screenshot-run only). NOTE: the
            # android-emulator-runner executes each script line in its own
            # shell, so no variable may span lines; keep find+install on one.
            APK=$(find work/HelloWorld/bin/Debug/net10.0-android -name "*-Signed.apk" | head -1); echo "Installing [$APK]"; adb install "$APK"
            adb logcat -c
            adb shell monkey -p com.companyname.helloworld -c android.intent.category.LAUNCHER 1
            sleep 120
            adb logcat -d | grep HWLAYOUT2 > hwlayout2.txt || echo "no HWLAYOUT2 lines captured"
            adb exec-out screencap -p > screenshot-1.png || true
            ls -la hwlayout2.txt screenshot-1.png || true; wc -l hwlayout2.txt || true

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: android-screenshots
          path: |
            screenshot-*.png
            hwlayout2.txt
