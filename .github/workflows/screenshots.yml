name: screenshots

# Manual-only: boots an Android emulator on a Linux runner, installs the
# debug APK, captures screenshots, and uploads them as an artifact.
# Stays on ubuntu-latest (1x billing) to keep org minutes cheap; this
# never runs on push.

on:
  workflow_dispatch:
  push:
    branches: [screenshot-run]

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Build debug APK
        # EmbedAssembliesIntoApk: a plain Debug build produces a Fast Deployment
        # APK whose assemblies live outside the APK (pushed by the IDE/CLI
        # deploy pipeline). adb install alone never pushes them, so the app
        # aborts on launch. Embedding makes the APK self-contained.
        run: dotnet build work/OcwOffline/OcwOffline.csproj -p:TargetFrameworks=net10.0-android -p:EmbedAssembliesIntoApk=true -c Debug --nologo -v q

      - name: Capture screenshots on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          disable-animations: true
          # NOTE: this action runs each script line in its own shell, so no
          # variable may span lines. Keep every step self-contained on one line.
          script: |
            ls work/OcwOffline/bin/Debug/net10.0-android/
            APK=$(find work/OcwOffline/bin/Debug/net10.0-android -maxdepth 1 -name "*-Signed.apk" | head -1); if [ -z "$APK" ]; then APK=$(find work/OcwOffline/bin/Debug/net10.0-android -maxdepth 1 -name "*.apk" | head -1); fi; echo "Installing [$APK]"; adb install "$APK"
            adb shell monkey -p com.owleyebooks.ocwoffline -c android.intent.category.LAUNCHER 1
            mkdir -p diag; adb shell pm list packages | grep ocwoffline | tee diag/packages.txt
            COMP=$(adb shell cmd package resolve-activity --brief com.owleyebooks.ocwoffline | tail -1 | tr -d '\r'); echo "launcher component: [$COMP]"; if [ -n "$COMP" ]; then adb shell am start -n "$COMP" | tee diag/amstart.txt; fi
            for i in $(seq 1 12); do FOCUS=$(adb shell dumpsys window windows | grep mCurrentFocus | head -1); echo "focus: $FOCUS"; echo "$FOCUS" | grep -q com.owleyebooks.ocwoffline && break; sleep 5; done; echo "$FOCUS" > diag/focus.txt
            adb shell dumpsys activity activities | grep -iB2 -A2 ocwoffline > diag/tasks.txt || true
            adb logcat -d | grep -iE "ocwoffline|AndroidRuntime|FATAL" | tail -40 > diag/logcat.txt || true
            adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS || true
            sleep 3
            adb shell screencap -p /sdcard/shot1.png && adb pull /sdcard/shot1.png screenshot-1-launch.png
            sleep 15
            adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS || true
            sleep 3
            adb shell screencap -p /sdcard/shot2.png && adb pull /sdcard/shot2.png screenshot-2-catalog.png
            if [ -s diag/tasks.txt ]; then echo ok > fg.txt; else echo "no app task, skipping tap"; fi
            if [ -f fg.txt ]; then timeout 60 adb shell uiautomator dump /sdcard/ui.xml && adb pull /sdcard/ui.xml ui.xml || echo "uiautomator unavailable, skipping tap"; fi
            ls -la ui.xml tap.txt > diag/uitap.txt 2>&1 || true
            if [ -f ui.xml ]; then python3 -c 'import re,xml.etree.ElementTree as ET; ns=[(int(m.group(1)),int(m.group(2)),int(m.group(3)),int(m.group(4))) for n in ET.parse("ui.xml").getroot().iter("node") if n.get("clickable")=="true" for m in [re.match(r"\[(\d+),(\d+)\]\[(\d+),(\d+)\]", n.get("bounds") or "")] if m]; pts=sorted([((a+c)//2,(b+d)//2) for a,b,c,d in ns if (b+d)//2>400], key=lambda p:p[1]); open("tap.txt","w").write("%d %d" % pts[0]) if pts else None; print("tap target:", pts[0] if pts else "none")' || echo "tap-target parse failed"; fi
            if [ -f tap.txt ]; then adb shell input tap $(cat tap.txt); sleep 8; adb shell screencap -p /sdcard/shot3.png && adb pull /sdcard/shot3.png screenshot-3-detail.png; fi
            adb logcat -d | tail -150 > diag/logcat-full.txt
            ls -la screenshot-*.png ui.xml diag/ || true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-screenshots
          path: |
            screenshot-*.png
            ui.xml
            diag/
